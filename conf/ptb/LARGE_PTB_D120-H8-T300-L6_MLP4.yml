# Dataset / Model parameters
data_dir: ./data/PTB
dataset: ptb
in_channels: 15
num_classes: 2
num_heads: 8
time_steps: 300
layer: 6
dim: 120 # 16 * 4
mlp_ratio: 4 # hidden_dim = 336

# Misc
seed: 42
batch_size: 32
val_batch_size: 32
lr: 1e-3
min_lr: 1e-5
sched: cosine
weight_decay: 6e-2
epochs: 100
cooldown_epochs: 10
warmup_epochs: 20
warmup_lr: 1e-6
opt: AdamW
workers: 8

# Ablation Studies
downsize_factor: 1
